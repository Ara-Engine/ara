[package]
name = "ara-play"
description = "The play-mode wire contract: player link messages, binary scene snapshots and the shared-memory transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-components = { path = "../ara-components" }
ara-doc.workspace = true
ara-schema.workspace = true
ciborium = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
tungstenite = { workspace = true, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }

[lints]
workspace = true
