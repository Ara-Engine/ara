[package]
name = "ara-ui-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
ara-ui = { path = "../ara-ui" }
ara-ui-text = { path = "../ara-ui-text" }
ara-ui-render = { path = "../ara-ui-render" }
ara-ui-stories = { path = "../ara-ui-stories" }
accesskit = { workspace = true }
tiny-skia = "0.12.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ara-doc = { path = "../ara-doc" }
ara-editor-gpu = { path = "../ara-editor-gpu" }

[lints]
workspace = true
