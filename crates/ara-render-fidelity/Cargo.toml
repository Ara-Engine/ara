[package]
name = "ara-render-fidelity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ara-gpu = { path = "../ara-gpu" }
ara-render = { path = "../ara-render" }
ara-components.workspace = true
ara-texture-stream = { path = "../ara-texture-stream" }
anyhow = "1"
bytemuck = { version = "1.24", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
ara-asset-format = { path = "../ara-asset-format" }
