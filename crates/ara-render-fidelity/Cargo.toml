[package]
name = "ara-render-fidelity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
hotpatch = ["dep:ara-hotpatch", "ara-render/hotpatch"]

[dependencies]
ara-hotpatch = { path = "../ara-hotpatch", optional = true, features = ["runtime"] }
ara-gpu = { path = "../ara-gpu" }
ara-render = { path = "../ara-render" }
ara-components.workspace = true
ara-schema.workspace = true
ara-texture-stream = { path = "../ara-texture-stream" }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true, features = ["bytemuck", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true, features = ["png"] }

[dev-dependencies]
blake3 = { workspace = true, default-features = true }
ara-asset-format = { path = "../ara-asset-format" }
ara-pathtrace = { path = "../ara-pathtrace" }
ara-render = { path = "../ara-render", features = ["fidelity-lab"] }

[[example]]
name = "reflect_g6"
path = "../ara-render/src/look/reflect/bench/main.rs"
