[package]
name = "ara-script"
description = "The C# host: the generated Rust<->C# ABI, C# bindings from the Schema DB, C# systems/behaviours/commands on bevy_ecs, hot reload and the ara_run worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile", "dep:tracing"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
tracing = { workspace = true, optional = true }
ara-components.workspace = true
ara-diag.workspace = true
ara-schema.workspace = true
bevy_ecs = { workspace = true, features = ["std", "multi_threaded", "async_executor"] }
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
# No `nethost`: `clr::find_hostfxr` locates hostfxr, so nothing is linked or downloaded at build time.
netcorehost = { version = "0.22", default-features = false, features = ["net10_0", "utils"] }
nonmax = { version = "0.5", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
libloading08.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
