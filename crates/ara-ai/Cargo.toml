[package]
name = "ara-ai"
description = "Ara gameplay AI: state trees with utility scoring, EQS queries and a text DSL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-cmd = { path = "../ara-cmd" }
ara-diag.workspace = true
ara-doc.workspace = true
ara-graph = { path = "../ara-graph" }
ara-json.workspace = true
ara-nav = { path = "../ara-nav" }
ara-ops.workspace = true
ara-perception = { path = "../ara-perception" }
ara-schema.workspace = true
ara-sim = { path = "../ara-sim" }
ara-why = { path = "../ara-why" }
bevy_ecs = { workspace = true, features = ["std", "multi_threaded"] }
blake3 = { workspace = true, default-features = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true

[[bench]]
name = "ai"
harness = false
