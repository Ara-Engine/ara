[package]
name = "ara-render2d"
description = "Bindless instanced sprites, tile chunks and shared HDR capture for Ara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-2d = { path = "../ara-2d" }
ara-gpu = { path = "../ara-gpu" }
ara-render = { path = "../ara-render" }
ara-sim = { path = "../ara-sim" }
ara-components = { path = "../ara-components" }
ara-physics2d = { path = "../ara-physics2d" }
ara-json = { path = "../ara-json" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
image = { workspace = true, features = ["png"] }
blake3 = { workspace = true, default-features = true }
ara-schema = { path = "../ara-schema" }
# Used only by the offline fixture/worker executable, never by the frame path.
ara-import2d = { path = "../ara-import2d" }
ara-asset = { path = "../ara-asset" }

[dev-dependencies]
ara-doc = { path = "../ara-doc" }
ara-cmd = { path = "../ara-cmd" }
ara-ops = { path = "../ara-ops" }

[lints]
workspace = true
