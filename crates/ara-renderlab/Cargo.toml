[package]
name = "ara-renderlab"
description = "Bridge from extracted Ara frames to the external Renderlab renderer (provisional: D35)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ara-components = { workspace = true }
ara-gpu = { path = "../ara-gpu" }
ara-render-fidelity = { path = "../ara-render-fidelity" }
ara-runtime = { path = "../ara-runtime" }
ara-runtime-render = { path = "../ara-runtime-render" }
# The effect library and its module types, for the particle mapping.
ara-material = { path = "../ara-material" }
ara-vfx = { path = "../ara-vfx" }

# Foliage instance transforms, in the glam the extracted frame uses, and the colour
# grade's vectors (`ara_render_fidelity::colour::Grading`): both arms map the frame.
glam34 = { workspace = true }
glam30 = { workspace = true }

# Apple: Renderlab's ara-gpu backend, which renders on the presenter's own device
# (Metal). Its ara-gpu is this workspace's
# (the root manifest's `[patch]`), so the device it renders on is the presenter's type.
# The same revision as elsewhere: one package, with the backend's feature on Apple.
[target.'cfg(target_vendor = "apple")'.dependencies]
renderlab = { git = "https://github.com/Ara-Engine/renderlab", rev = "69baaf100991a3f6d299d0785c76e2634220bf41", features = ["backend-ara"] }

# Elsewhere Renderlab renders through wgpu on its own Vulkan device.
# Pinned: the engine builds against a frozen renderer while it is improved
# behind `renderlab::engine`. Nothing outside this crate names a Renderlab type.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
# One revision for both targets (Renderlab `t3/ara-gpu-views`, PR #42): Renderlab main with the view
# API (#39) and the emitter curl work (#25), plus the Metal backend's multi-view port. Off
# Apple, outside `src/backend_ara`, it is main's code.
renderlab = { git = "https://github.com/Ara-Engine/renderlab", rev = "69baaf100991a3f6d299d0785c76e2634220bf41" }
# The shared-image handoff reaches Renderlab's raw Vulkan device through wgpu-hal, with
# the ash that wgpu-hal itself binds. Neither appears in this crate's public surface.
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
ash038 = { package = "ash", version = "0.38", default-features = false, features = ["std"] }

[dev-dependencies]
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }
ara-frame = { path = "../ara-frame" }
image = { workspace = true, features = ["png"] }
