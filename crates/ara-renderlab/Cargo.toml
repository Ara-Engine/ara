[package]
name = "ara-renderlab"
description = "Bridge from extracted Ara frames to the external Renderlab renderer (provisional: D35)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ara-components = { workspace = true }
ara-gpu = { path = "../ara-gpu" }
ara-render-fidelity = { path = "../ara-render-fidelity" }
ara-runtime = { path = "../ara-runtime" }
ara-runtime-render = { path = "../ara-runtime-render" }
# The effect library and its module types, for the particle mapping.
ara-material = { path = "../ara-material" }
ara-vfx = { path = "../ara-vfx" }

# Renderlab is Vulkan-only today; Apple targets keep Ara's renderer (`ARA_RENDERLAB_UNAVAILABLE`).
# Pinned: the engine builds against a frozen renderer while it is improved
# behind `renderlab::engine`. Nothing outside this crate names a Renderlab type.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
# Renderlab main (v0.1.3 plus 256 groups per frame #2, the emitter work #6, wgpu object
# names opt-in #12, the adapter's TLAS limit #13, P-PIPE, P-SKY's filtered sky lookups with
# `Background::ScaledSky` #16/#17 and `Settings::sky_light` #21) with one open PR merged on
# top on `t3/ara-pin-curl`: the emitter curl's origin, birth-time phase and stepped prewarm
# (Ara-Engine/renderlab#25). Repin to main when it merges.
renderlab = { git = "https://github.com/Ara-Engine/renderlab", rev = "a977ba2e2ffa1f206f68d90a90cc187ab6ca8455" }
# The shared-image handoff reaches Renderlab's raw Vulkan device through wgpu-hal, with
# the ash that wgpu-hal itself binds. Neither appears in this crate's public surface.
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
ash038 = { package = "ash", version = "0.38", default-features = false, features = ["std"] }
# Foliage instance transforms, in the glam the extracted frame uses.
glam34 = { workspace = true }
# Ara's colour grade (`ara_render_fidelity::colour::Grading`) takes this glam's vectors.
glam30 = { workspace = true }

[dev-dependencies]
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }
ara-render = { path = "../ara-render" }
image = { workspace = true, features = ["png"] }
