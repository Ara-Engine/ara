[package]
name = "ara-save"
description = "Schema-declared persistent state, migrated atomic save slots and agent tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-diag = { path = "../ara-diag" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
ara-sim = { path = "../ara-sim" }
blake3 = { workspace = true, default-features = true }
ciborium = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tempfile = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ara-doc = { path = "../ara-doc" }

[lints]
workspace = true
