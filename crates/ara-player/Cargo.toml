[package]
name = "ara-player"
description = "The play process: a pooled, single-use player that runs a scene for the edit-world owner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
hotpatch = ["dep:ara-hotpatch", "ara-sim/hotpatch", "ara-runtime-render/hotpatch"]
tracy = ["ara-gpu/tracy"]
fidelity-lab = ["dep:ara-pathtrace", "dep:ara-render-fidelity", "ara-render/fidelity-lab", "ara-runtime-render/fidelity-lab", "ara-gpu/fidelity-lab", "image/exr"]

[build-dependencies]
embed-resource.workspace = true

[dependencies]
ara-bench = { path = "../ara-bench", default-features = false }
ara-hotpatch = { path = "../ara-hotpatch", optional = true, features = ["runtime"] }
anyhow = { workspace = true }
ara-2d = { path = "../ara-2d" }
ara-asset = { path = "../ara-asset" }
ara-audio = { path = "../ara-audio" }
ara-components.workspace = true
ara-crash = { path = "../ara-crash" }
ara-gpu = { path = "../ara-gpu" }
ara-pathtrace = { path = "../ara-pathtrace", optional = true }
ara-input = { path = "../ara-input" }
ara-platform = { path = "../ara-platform" }
ara-physics = { path = "../ara-physics" }
ara-play = { path = "../ara-play" }
ara-play-host = { path = "../ara-play-host" }
ara-json.workspace = true
ara-pack = { path = "../ara-pack", default-features = false, features = ["native-decode"] }
ara-render = { path = "../ara-render" }
ara-render-fidelity = { path = "../ara-render-fidelity", optional = true }
ara-runtime = { path = "../ara-runtime" }
ara-runtime-audio = { path = "../ara-runtime-audio" }
ara-runtime-net = { path = "../ara-runtime-net" }
ara-nav = { path = "../ara-nav" }
ara-anim = { path = "../ara-anim" }
ara-runtime-world = { path = "../ara-runtime-world" }
ara-schema.workspace = true
ara-runtime-render = { path = "../ara-runtime-render" }
ara-runtime-script = { path = "../ara-runtime-script" }
ara-sim = { path = "../ara-sim" }
ara-doc.workspace = true
ara-editor-gpu = { path = "../ara-editor-gpu" }
ara-ui = { path = "../ara-ui" }
ara-ui-text = { path = "../ara-ui-text" }
ara-ui-render = { path = "../ara-ui-render" }
ara-diag = { path = "../ara-diag" }
clap = { workspace = true, features = ["derive"] }
ciborium.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
glam34 = { workspace = true }
image = { workspace = true, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }

[dev-dependencies]
ara-hub-service = { path = "../ara-hub-service" }
ara-host.workspace = true
ara-import2d = { path = "../ara-import2d" }
ara-importers = { path = "../ara-importers" }
ara-mcp.workspace = true
ara-ops.workspace = true

[lints]
workspace = true
