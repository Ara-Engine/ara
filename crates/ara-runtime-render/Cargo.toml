[package]
name = "ara-runtime-render"
description = "Presents ara-runtime frames with ara-render: extraction upload, CPU skinning, sky and labelled captures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
ara-2d = { path = "../ara-2d" }
ara-asset-format = { path = "../ara-asset-format" }
ara-foliage = { path = "../ara-foliage" }
ara-render-fidelity = { path = "../ara-render-fidelity" }
ara-gpu = { path = "../ara-gpu" }
ara-landscape = { path = "../ara-landscape" }
ara-render = { path = "../ara-render" }
ara-render2d = { path = "../ara-render2d" }
ara-runtime = { path = "../ara-runtime" }
ara-schema.workspace = true
ara-terrain = { path = "../ara-terrain" }
ara-vfx = { path = "../ara-vfx" }
ara-vfx-gpu = { path = "../ara-vfx-gpu" }
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "multi_threaded"] }
serde.workspace = true
serde_json.workspace = true
glam = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
# ara-render's scene/camera API uses glam 0.30 types.
glam30 = { package = "glam", version = "0.30" }
texture2ddecoder = "0.1.2"

[dev-dependencies]
ara-asset = { path = "../ara-asset" }
ara-doc.workspace = true
ara-importers = { path = "../ara-importers" }
ara-input = { path = "../ara-input" }
ara-sim = { path = "../ara-sim" }
serde_json.workspace = true

[lints]
workspace = true
