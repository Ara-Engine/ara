[package]
name = "ara-dev"
description = "Local integration gate, merge flow and machine hygiene for Ara developers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-bench = { path = "../ara-bench", default-features = false }
blake3.workspace = true
ara-hotpatch = { path = "../ara-hotpatch" }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
quote.workspace = true
semver = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
syn = { workspace = true, features = ["visit"] }
toml_edit = { version = "0.25", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
object = { version = "0.37", features = ["write"] }
cc.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[lints]
workspace = true

[dev-dependencies]
ara-doc.workspace = true
ara-json.workspace = true
proc-macro2.workspace = true
tempfile.workspace = true
