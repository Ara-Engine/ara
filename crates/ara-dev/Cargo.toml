[package]
name = "ara-dev"
description = "Local integration gate, merge flow and machine hygiene for Ara developers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["visit"] }
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
