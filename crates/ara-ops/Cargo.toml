[package]
name = "ara-ops"
description = "Transactions over Ara documents: all-or-nothing apply, attributed history, undo/redo with conflict checks, and the op stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-diag.workspace = true
ara-doc.workspace = true
ara-schema.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ara-components.workspace = true
ara-json.workspace = true
proptest = { workspace = true }

[lints]
workspace = true
