[package]
name = "ara-texture-gpu"
description = "Deterministic headless GPU block compression for isolated import workers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }
ara-gpu = { path = "../ara-gpu" }
ara-json = { path = "../ara-json" }
ash.workspace = true
bytemuck.workspace = true
blake3.workspace = true
getrandom = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
bcdec_rs = "0.2.1"

[lints]
workspace = true
