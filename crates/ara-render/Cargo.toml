[package]
name = "ara-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
hotpatch = ["dep:ara-hotpatch"]
profiling = ["dep:ara-profile"]

[dependencies]
ara-hotpatch = { path = "../ara-hotpatch", optional = true, features = ["runtime"] }
ara-json.workspace = true
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
ara-gpu = { path = "../ara-gpu" }
ara-platform = { path = "../ara-platform" }
ara-vsm = { path = "../ara-vsm" }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true, features = ["bytemuck", "serde"] }
image = { workspace = true, features = ["png", "hdr", "jpeg"] }
sha2 = { workspace = true }

[dev-dependencies]
ash.workspace = true
gltf = { workspace = true, default-features = true }
