[package]
name = "ara-vfx-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ara-vfx = { path = "../ara-vfx" }
ara-gpu = { path = "../ara-gpu" }
ara-render = { path = "../ara-render" }
ara-material = { path = "../ara-material" }
ara-json = { path = "../ara-json" }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true, features = ["bytemuck", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
blake3 = { workspace = true, default-features = true }

[dev-dependencies]
ara-render-fidelity = { path = "../ara-render-fidelity" }
ara-shader-cook = { path = "../ara-shader-cook" }
image = { workspace = true, features = ["png"] }
