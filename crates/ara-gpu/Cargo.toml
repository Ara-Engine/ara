[package]
name = "ara-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
tracy = ["dep:tracy-client"]

[dependencies]
ara-diag = { path = "../ara-diag" }
ara-json.workspace = true
ash = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tracy-client = { version = "0.18", optional = true, default-features = false, features = ["enable"] }

# Metal 4 backend (D12/D15): Apple silicon only. Bindings are generated from the
# Xcode 26 SDK; the backend never links a shader compiler.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3"
objc2-io-surface = "0.3.2"
objc2-metal-performance-shaders = { version = "0.3.2", default-features = false, features = ["std", "MPSCore", "MPSCoreTypes", "MPSKernel", "MPSImage", "MPSImageKernel", "MPSImageResampling"] }
dispatch2 = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
sdl3-sys = { package = "ara-sdl3-src", path = "../ara-sdl3-src" }

# SDL video must run on the main thread on macOS.
[[test]]
name = "metal_sdl"
harness = false

# Re-spawns itself as the shared-surface producer (D19).
[[test]]
name = "metal_shared_process"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
