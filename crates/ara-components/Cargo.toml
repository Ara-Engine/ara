[package]
name = "ara-components"
description = "Schemas of the engine's built-in components (Transform), shared by authoring and runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-schema.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
