[package]
name = "ara-runtime-script"
description = "C# gameplay in the runtime: ara-script modules on the ara-sim world, hot reload at tick boundaries, snapshots and play commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-components.workspace = true
ara-diag.workspace = true
ara-input = { path = "../ara-input" }
ara-nav = { path = "../ara-nav" }
ara-anim = { path = "../ara-anim" }
ara-physics = { path = "../ara-physics" }
ara-runtime = { path = "../ara-runtime" }
ara-schema.workspace = true
ara-script = { path = "../ara-script" }
ara-sim = { path = "../ara-sim" }
bevy_ecs = { workspace = true, features = ["std", "multi_threaded"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
