[package]
name = "ara-sim"
description = "Scene projection, deterministic local sessions and play control for Ara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile", "dep:tracing"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
tracing = { workspace = true, optional = true }
ara-components = { path = "../ara-components" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-input = { path = "../ara-input" }
ara-json = { path = "../ara-json" }
ara-ops = { path = "../ara-ops" }
ara-schema = { path = "../ara-schema" }
bevy_ecs = { workspace = true, features = ["std", "multi_threaded", "serialize"] }
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
blake3 = { workspace = true, default-features = true }
ciborium = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "ecs"
harness = false

[lints]
workspace = true
