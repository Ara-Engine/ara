[package]
name = "ara-sim"
description = "Scene projection, deterministic local sessions and play control for Ara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile", "bevy_ecs/trace"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true }
ara-components = { path = "../ara-components" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-input = { path = "../ara-input" }
ara-json = { path = "../ara-json" }
ara-ops = { path = "../ara-ops" }
ara-schema = { path = "../ara-schema" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded", "serialize"] }
bevy_tasks = { version = "=0.20.0", features = ["multi_threaded"] }
serde.workspace = true
serde_json.workspace = true
blake3 = "1.8"
ciborium = "=0.2.2"

[dev-dependencies]
glam = "=0.30.9"
rayon = "=1.11.0"

[[bench]]
name = "ecs"
harness = false

[lints]
workspace = true
