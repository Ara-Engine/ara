[package]
name = "ara-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
ecs = ["dep:bevy_ecs"]

[dependencies]
ara-schema = { path = "../ara-schema" }
ara-json = { path = "../ara-json" }
kira = { version = "=0.12.5", default-features = false }
sdl3-sys = { version = "0.7.2", default-features = false, features = ["no-link"] }
libloading = "0.9"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "adpcm", "flac", "vorbis", "ogg"] }
opus = "=0.4.0"
ogg = "0.9"
rtrb = "0.4"
ebur128 = "0.1"
rustfft = "6"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
blake3 = "1"
bevy_ecs = { version = "0.20", default-features = false, features = ["std"], optional = true }

[lints]
workspace = true
