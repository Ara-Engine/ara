[package]
name = "ara-runtime"
description = "Composes simulation, input, physics, animation, navigation and cooked assets into one playable runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
hotpatch = ["ara-sim/hotpatch"]

[dependencies]
ara-2d = { path = "../ara-2d" }
ara-ai = { path = "../ara-ai" }
ara-anim = { path = "../ara-anim" }
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }
ara-acoustics = { path = "../ara-acoustics", features = ["ecs"] }
ara-audio = { path = "../ara-audio", features = ["ecs"] }
ara-audio-graph = { path = "../ara-audio-graph" }
ara-audio-mix = { path = "../ara-audio-mix" }
ara-music = { path = "../ara-music" }
ara-cmd.workspace = true
ara-components.workspace = true
ara-diag.workspace = true
ara-doc.workspace = true
ara-foliage = { path = "../ara-foliage" }
ara-graph = { path = "../ara-graph" }
ara-l10n = { path = "../ara-l10n" }
ara-material = { path = "../ara-material" }
ara-physics2d = { path = "../ara-physics2d" }
ara-save = { path = "../ara-save" }
ara-terrain = { path = "../ara-terrain" }
ara-vfx = { path = "../ara-vfx" }
ara-world = { path = "../ara-world" }
ara-input = { path = "../ara-input" }
ara-json.workspace = true
ara-ops.workspace = true
ara-nav = { path = "../ara-nav" }
ara-perception = { path = "../ara-perception" }
ara-physics = { path = "../ara-physics" }
ara-physics-jolt = { path = "../ara-physics-jolt" }
ara-schema.workspace = true
ara-sim = { path = "../ara-sim" }
bevy_ecs = { workspace = true, features = ["std", "multi_threaded"] }
bytemuck = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
glam34 = { workspace = true, features = ["serde"] }

[dev-dependencies]
ara-importers = { path = "../ara-importers" }

[lints]
workspace = true
