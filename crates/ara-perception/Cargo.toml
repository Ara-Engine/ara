[package]
name = "ara-perception"
description = "Deterministic AI perception for Ara: sight cones, hearing and memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-physics = { path = "../ara-physics" }
ara-schema = { path = "../ara-schema" }
bevy_ecs = { workspace = true, features = ["std", "multi_threaded"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
