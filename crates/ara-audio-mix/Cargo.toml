[package]
name = "ara-audio-mix"
description = "Mixer documents for ara-audio: bus tree, reverb sends, ducking, category voice limits, loudness targets and mix states."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-cmd.workspace = true
ara-json = { path = "../ara-json" }
ara-audio = { path = "../ara-audio" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-schema = { path = "../ara-schema" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true

[dev-dependencies]
ara-ops.workspace = true
