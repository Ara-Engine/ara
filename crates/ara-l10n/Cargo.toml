[package]
name = "ara-l10n"
description = "Schema-owned localization, ICU4X messages and translator workflows for Ara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-cmd = { path = "../ara-cmd" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
ara-ui-stories = { path = "../ara-ui-stories" }
blake3 = { workspace = true, default-features = true }
icu_datetime = "2.4"
icu_calendar = "2.4"
icu_decimal = "2.4"
icu_locale = "2.4"
icu_plurals = "2.4"
icu_experimental = "0.7"
fixed_decimal = "0.7"
writeable = "0.6"
quick-xml = "0.38"
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ara-ops = { path = "../ara-ops" }
ara-ui-test = { path = "../ara-ui-test" }

[lints]
workspace = true
