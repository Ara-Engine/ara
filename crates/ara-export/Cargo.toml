[package]
name = "ara-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-crash = { path = "../ara-crash", features = ["symbols", "explain"] }
ara-export-installer = { path = "../ara-export-installer" }
ara-pack = { path = "../ara-pack" }
ara-asset = { path = "../ara-asset" }
ara-play = { path = "../ara-play" }
ara-play-host = { path = "../ara-play-host" }
ara-bridge = { path = "../ara-bridge" }
ara-diag.workspace = true
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
anyhow = "1.0.103"
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
clap.workspace = true
ciborium = "0.2"
dunce = "1.0.5"
quick-xml = "0.38.4"
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
backhand = { version = "0.25.5", default-features = false, features = ["gzip", "error-strings"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
