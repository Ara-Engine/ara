[package]
name = "ara-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-crash = { path = "../ara-crash", features = ["symbols", "explain"] }
ara-export-installer = { path = "../ara-export-installer" }
ara-pack = { path = "../ara-pack" }
ara-asset = { path = "../ara-asset" }
ara-play = { path = "../ara-play" }
ara-play-host = { path = "../ara-play-host" }
ara-bridge = { path = "../ara-bridge" }
ara-diag.workspace = true
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
anyhow = { workspace = true }
blake3 = { workspace = true, features = ["std", "pure"] }
clap = { workspace = true, features = ["derive"] }
ciborium.workspace = true
dunce = "1.0.5"
quick-xml = "0.38.4"
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
zip = { workspace = true, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
backhand = { version = "0.25.5", default-features = false, features = ["gzip", "error-strings"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
