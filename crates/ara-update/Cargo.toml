[package]
name = "ara-update"
description = "Signed GitHub releases, resumable downloads and atomic Ara installs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-diag.workspace = true
ara-json.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.3", optional = true }
semver = { version = "1", features = ["serde"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
test-support = ["dep:getrandom"]

[dev-dependencies]
ara-update = { path = ".", features = ["test-support"] }

[lints]
workspace = true
