[package]
name = "ara-editor-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ara-gpu = { path = "../ara-gpu" }
ara-platform = { path = "../ara-platform" }
ara-ui = { path = "../ara-ui" }
ara-ui-render = { path = "../ara-ui-render" }
anyhow = { workspace = true }
ash = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true, features = ["png"] }

# The Metal adapter (macOS) reads its cooked pipeline manifest and retains slot textures.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
serde_json = { workspace = true }
