[package]
name = "ara-hub"
description = "Ara Hub: the native project launcher on the editor's UI stack (D25)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ara-hub"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
ara-crash = { path = "../ara-crash" }
ara-diag.workspace = true
ara-editor-gpu = { path = "../ara-editor-gpu" }
ara-gpu = { path = "../ara-gpu" }
ara-hub-service = { path = "../ara-hub-service" }
ara-json.workspace = true
ara-platform = { path = "../ara-platform" }
ara-proto.workspace = true
ara-rpc.workspace = true
ara-ui = { path = "../ara-ui" }
ara-ui-render = { path = "../ara-ui-render" }
ara-ui-text = { path = "../ara-ui-text" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", default-features = false }
sdl3-sys = { version = "0.7", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
