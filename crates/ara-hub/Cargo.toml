[package]
name = "ara-hub"
description = "Ara Hub: the native project launcher on stillkit (D25, D31)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "ara-hub"

[features]
# Windowless release-day rehearsal only; not enabled in shipping builds.
rehearsal = ["ara-update/test-support"]

[lints]
workspace = true

[[bin]]
name = "ara-hub"
path = "src/main.rs"

[build-dependencies]
embed-resource.workspace = true

[dependencies]
ara-update = { path = "../ara-update" }
ara-crash = { path = "../ara-crash" }
ara-diag.workspace = true
ara-agents = { path = "../ara-agents" }
ara-hub-service = { path = "../ara-hub-service" }
ara-json.workspace = true
ara-kit = { path = "../ara-kit" }
stillkit.workspace = true
ara-proto.workspace = true
ara-rpc.workspace = true
anyhow.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
