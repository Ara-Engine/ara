[package]
name = "ara-release"
description = "Windows engine release packager, installer and installed-build smoke test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "ara-release"

[dependencies]
ara-update = { path = "../ara-update" }
getrandom = "0.3"
hex = "0.4"
anyhow.workspace = true
ara-export-installer = { path = "../ara-export-installer" }
ara-json = { path = "../ara-json" }
blake3 = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
ara-update = { path = "../ara-update", features = ["test-support"] }
