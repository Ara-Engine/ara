[package]
name = "ara-release"
description = "Windows engine release packager, installer and installed-build smoke test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "ara-release"

[dependencies]
ara-update = { path = "../ara-update" }
getrandom = "0.3"
hex = "0.4"
anyhow = "1"
ara-export-installer = { path = "../ara-export-installer" }
ara-json = { path = "../ara-json" }
blake3 = "1.8"
clap.workspace = true
serde_json.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
ara-update = { path = "../ara-update", features = ["test-support"] }
