[package]
name = "ara-release"
description = "Windows engine release packager, installer and installed-build smoke test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "ara-release"

[dependencies]
anyhow = "1"
ara-export-installer = { path = "../ara-export-installer" }
ara-json = { path = "../ara-json" }
blake3 = "1.8"
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
