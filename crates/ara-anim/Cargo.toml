[package]
name = "ara-anim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
ara-schema = { path = "../ara-schema" }
ara-json = { path = "../ara-json" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-ops = { path = "../ara-ops" }
glam = { version = "0.34.1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }

[dev-dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
rayon = "1.11"
stats_alloc = "0.1.10"

[lints]
workspace = true
