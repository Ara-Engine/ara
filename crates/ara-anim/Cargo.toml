[package]
name = "ara-anim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile"]

[dependencies]
ara-cmd.workspace = true
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
ara-schema = { path = "../ara-schema" }
ara-json = { path = "../ara-json" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-ops = { path = "../ara-ops" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
postcard = { workspace = true, features = ["alloc"]}
glam34 = { workspace = true, features = ["serde"] }

[dev-dependencies]
gltf = { workspace = true, features = ["utils", "names"] }
rayon = { workspace = true }
stats_alloc = "0.1.10"

[lints]
workspace = true
