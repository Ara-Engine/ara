[package]
name = "ara-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-json = { path = "../ara-json" }
ara-ui-document = { path = "../ara-ui-document" }
ara-ui-text = { path = "../ara-ui-text" }
accesskit = { workspace = true, features = ["serde"] }
parley = { workspace = true, features = ["std", "complex-scripts"] }
taffy = "0.15.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
