[package]
name = "ara-hub-service"
description = "User-level project registry, engine lifecycle and JSON-RPC API for Ara Hub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-update = { path = "../ara-update" }
ara-diag.workspace = true
ara-host.workspace = true
ara-json.workspace = true
ara-proto.workspace = true
ara-rpc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true

[dev-dependencies]
ara-update = { path = "../ara-update", features = ["test-support"] }
