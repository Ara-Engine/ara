[package]
name = "ara"
description = "Ara command-line tool and daemon: the single entry point for humans and agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-hub-service = { path = "../ara-hub-service" }
ara-ai = { path = "../ara-ai" }
ara-audio-why = { path = "../ara-audio-why" }
ara-world = { path = "../ara-world", features = ["host"] }
ara-profile = { path = "../ara-profile" }
ara-diag.workspace = true
ara-doc.workspace = true
ara-host.workspace = true
ara-json.workspace = true
ara-mcp.workspace = true
ara-merge.workspace = true
ara-play-host = { path = "../ara-play-host" }
ara-proto.workspace = true
ara-rpc.workspace = true
ara-schema.workspace = true
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
