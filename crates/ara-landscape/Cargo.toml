[package]
name = "ara-landscape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ara-terrain = { path = "../ara-terrain" }
ara-foliage = { path = "../ara-foliage" }
ara-gpu = { path = "../ara-gpu" }
ara-render = { path = "../ara-render" }
ara-texture-stream = { path = "../ara-texture-stream" }
ara-material = { path = "../ara-material" }
ara-doc = { path = "../ara-doc" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
ara-asset-format = { path = "../ara-asset-format" }
half = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true, features = ["bytemuck", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
image = { workspace = true, features = ["png"] }
blake3 = { workspace = true, default-features = true }

[dev-dependencies]
ara-shader-cook = { path = "../ara-shader-cook" }
