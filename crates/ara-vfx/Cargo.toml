[package]
name = "ara-vfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ara-cmd = { path = "../ara-cmd" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-graph = { path = "../ara-graph" }
ara-json = { path = "../ara-json" }
ara-material = { path = "../ara-material" }
ara-schema = { path = "../ara-schema" }
blake3 = { workspace = true, default-features = true }
bevy_ecs = { workspace = true, features = ["std"] }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ara-ops = { path = "../ara-ops" }
