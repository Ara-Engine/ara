[package]
name = "ara-export-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ara-export-smoke"
path = "src/bin/ara-export-player.rs"

[features]
default = []
dev-bridge = ["dep:ara-bridge"]

[dependencies]
ara-pack = { path = "../ara-pack", default-features = false }
ara-bridge = { path = "../ara-bridge", optional = true }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
libloading = "0.8.9"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
