[package]
name = "ara-export-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ara-export-smoke"
path = "src/bin/ara-export-player.rs"

[features]
default = []
dev-bridge = ["dep:ara-bridge"]

[dependencies]
ara-crash = { path = "../ara-crash" }
ara-pack = { path = "../ara-pack", default-features = false }
ara-bridge = { path = "../ara-bridge", optional = true }
bevy_ecs = { workspace = true, features = ["std"] }
blake3 = { workspace = true, features = ["std", "pure"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
libloading08.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
