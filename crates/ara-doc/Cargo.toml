[package]
name = "ara-doc"
description = "Authoring documents (scenes, prefabs): records, canonical files, @path#id references, prefab instances and ops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-diag.workspace = true
ara-json.workspace = true
ara-schema.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
unicode-casefold = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
ara-components.workspace = true
insta = { workspace = true }
proptest = { workspace = true }
unicode-normalization = "0.1"

[lints]
workspace = true
