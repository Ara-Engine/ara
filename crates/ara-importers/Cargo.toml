[package]
name = "ara-importers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extensions", "extras", "KHR_texture_transform", "KHR_lights_punctual", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_materials_ior", "KHR_materials_transmission"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
intel_tex_2 = "=0.5.0"
half = { version = "=2.7.1", features = ["bytemuck"] }
meshopt = "=0.7.0"
mikktspace = { version = "=0.3.0", default-features = false, features = ["glam"] }
ufbx = "=0.11.5"
serde.workspace = true
serde_json.workspace = true
urlencoding = "2.1"

[dev-dependencies]
texture2ddecoder = "=0.1.2"
bcdec_rs = "=0.2.1"

[lints]
workspace = true
