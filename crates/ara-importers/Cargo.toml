[package]
name = "ara-importers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
prepared-lods = ["dep:ara-meshopt-sys"]

[dependencies]
ara-meshopt-sys = { path = "../ara-meshopt-sys", optional = true }
ara-audio = { path = "../ara-audio" }
ara-cmd.workspace = true
ara-doc.workspace = true
ara-diag.workspace = true
rayon = { workspace = true }
ara-asset = { path = "../ara-asset" }
ara-geo = { path = "../ara-geo" }
ara-asset-format = { path = "../ara-asset-format" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
base64 = "0.22"
bytemuck = { workspace = true, features = ["derive", "extern_crate_alloc"] }
gltf = { workspace = true, features = ["utils", "names", "extensions", "extras", "KHR_texture_transform", "KHR_lights_punctual", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_materials_ior", "KHR_materials_transmission"] }
image = { workspace = true, features = ["png", "jpeg", "hdr", "exr"] }
intel_tex_2 = "0.5.0"
half = { workspace = true, features = ["bytemuck"] }
meshopt = "0.7.0"
mikktspace = { version = "0.3.0", default-features = false, features = ["glam"] }
ufbx = "0.11.5"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
urlencoding = "2.1"

[dev-dependencies]
ara-ops.workspace = true
texture2ddecoder = { workspace = true }
bcdec_rs = "0.2.1"
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
