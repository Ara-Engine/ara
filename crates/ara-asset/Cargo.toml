[package]
name = "ara-asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
rayon = "1.11"
ara-asset-format = { path = "../ara-asset-format" }
ara-doc = { path = "../ara-doc" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
ara-diag = { path = "../ara-diag" }
blake3 = "1.8"
notify = "8.2"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tempfile = "3.23"
rmp-serde = "1.3"
serde_bytes = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
ara-ops = { path = "../ara-ops" }

[lints]
workspace = true
