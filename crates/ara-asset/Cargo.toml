[package]
name = "ara-asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
rayon = { workspace = true }
ara-asset-format = { path = "../ara-asset-format" }
ara-doc = { path = "../ara-doc" }
ara-json = { path = "../ara-json" }
ara-schema = { path = "../ara-schema" }
ara-diag = { path = "../ara-diag" }
blake3 = { workspace = true, default-features = true }
notify = "8.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror = { workspace = true }
tempfile = { workspace = true }
rmp-serde = "1.3"
serde_bytes = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
ara-ops = { path = "../ara-ops" }

[[test]]
name = "worker_limit"
harness = false

[lints]
workspace = true
