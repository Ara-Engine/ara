[package]
name = "ara-physics"
description = "Ara physics schemas, deterministic tick contract and Bevy ECS integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
bench = []
profiling = ["dep:ara-profile"]
[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
ara-schema = { path = "../ara-schema" }
ara-diag = { path = "../ara-diag" }
bevy_ecs = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
