[package]
name = "ara-host"
description = "The project host: sessions, the Engine Protocol method registry and core services, review state, the journal, always-saved persistence and external-edit reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-profile = { path = "../ara-profile" }
ara-cmd.workspace = true
ara-collab = { path = "../ara-collab" }
ara-components.workspace = true
ara-diag.workspace = true
ara-doc.workspace = true
ara-json.workspace = true
ara-merge.workspace = true
ara-ops.workspace = true
ara-proto.workspace = true
ara-schema.workspace = true
ara-why = { path = "../ara-why" }
ara-ui-document = { path = "../ara-ui-document" }
notify = "8.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
