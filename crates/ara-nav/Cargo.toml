[package]
name = "ara-nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profiling = ["dep:ara-profile"]

[dependencies]
ara-profile = { path = "../ara-profile", optional = true, features = ["instrumentation"] }
ara-nav-sys = { path = "../ara-nav-sys" }
ara-crowd = { path = "../ara-crowd" }
ara-schema = { path = "../ara-schema" }
ara-diag = { path = "../ara-diag" }
bevy_ecs = { workspace = true, features = ["std", "multi_threaded"] }
blake3 = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive","rc"] }
postcard = { workspace = true, features = ["alloc", "use-std"] }
rayon = { workspace = true }

[dev-dependencies]
ara-json = { path = "../ara-json" }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[[bench]]
name = "navigation"
harness = false

[lints]
workspace = true

[[bench]]
name = "scale"
harness = false
