[package]
name = "ara-2d"
description = "Reflected 2D assets, tilemaps and transactional authoring for Ara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-schema = { path = "../ara-schema" }
ara-json = { path = "../ara-json" }
ara-cmd = { path = "../ara-cmd" }
ara-diag = { path = "../ara-diag" }
ara-sim = { path = "../ara-sim" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
anyhow = { workspace = true }
blake3 = { workspace = true, default-features = true }
bevy_ecs = { workspace = true, features = ["std"] }

[dev-dependencies]
ara-doc = { path = "../ara-doc" }
ara-ops = { path = "../ara-ops" }

[lints]
workspace = true
