<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ara tool pages: before and after</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#0a0a0a;color:#f5f5f5;font:13px system-ui,sans-serif}
main{display:grid;gap:16px}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;background:#111;border:1px solid #2e2e2e;border-radius:6px;padding:6px 10px;cursor:pointer}
button[aria-pressed=true]{border-color:#346bf1;background:#16233f}
button:focus-visible{outline:2px solid #346bf1;outline-offset:2px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;padding:12px;border:1px solid #2e2e2e;border-radius:10px;background:#111;min-width:0}
figure img{width:100%;height:auto;display:block;border-radius:4px}figcaption{margin-bottom:8px;color:#818181}
.sep{width:1px;height:20px;background:#2e2e2e}
@media(max-width:900px){.shots{grid-template-columns:1fr}}
</style>
<main>
<nav aria-label="Page"><span id="pages"></span><span class="sep"></span><span id="themes"></span></nav>
<section class="shots">
<figure><figcaption id="before-caption"></figcaption><img id="before" alt="Before"></figure>
<figure><figcaption id="after-caption"></figcaption><img id="after" alt="After"></figure>
</section>
<p style="color:#818181">1440×900 at 1×, captured offscreen by <code>--verify-panels</code>. See README.md for the method and the 2560×1440 set.</p>
</main>
<script>
// [key, label, before image prefix, after image prefix, before caption, after caption]
const r1=["Before · preview 4 (497e8dec)","After · round 1"],r2=["Before · 7c728927 + dda5b934","After · round 2"];
const pages=[["assets","Model thumbnail + Import","before/1440/assets","after/1440/assets",...r1],["assets-samples","Material + VFX thumbnails","before/1440/assets-samples","after/1440/assets-samples",...r1],["material","Material","before/1440/material","after/1440/material",...r1],["material-add","Add node","before/1440/material-add","after/1440/material-add",...r1],["vfx","VFX","before/1440/vfx","after/1440/vfx",...r1],["animation-states","Animation states","before/1440/animation-states","after/1440/animation-states",...r1],["animation-blends","Animation blends","before/1440/animation-blends","after/1440/animation-blends",...r1],
["material-previews","In-node previews","after/1440/material","r2/after/1440/material-previews","Round 1 · no previews","After · in-node previews"],["vfx-enable","VFX module enable","after/1440/vfx","r2/after/1440/vfx","Round 1 · no enable","After · per-module checkbox"],
["profiler","Profiler","r2/before/1440/profiler","r2/after/1440/profiler",...r2],["profiler-compare","Profiler compare","r2/before/1440/profiler-compare","r2/after/1440/profiler-compare",...r2],["console","Console","r2/before/1440/console","r2/after/1440/console",...r2],["problems","Problems","r2/before/1440/problems","r2/after/1440/problems",...r2],["agents","Agents","r2/before/1440/agents","r2/after/1440/agents",...r2],["settings","Preferences","r2/before/1440/settings","r2/after/1440/settings",...r2],["settings-project","Project Settings","r2/before/1440/settings-project","r2/after/1440/settings-project",...r2],["shortcuts","Keyboard shortcuts","r2/before/1440/shortcuts","r2/after/1440/shortcuts",...r2]];
const themes=["dark","light"];let page=pages[0][0],theme="dark";
function group(id,items,get,set){const el=document.getElementById(id);el.replaceChildren(...items.map(([key,label])=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>{set(key);render()};b.dataset.key=key;return b}));return el}
const p=group("pages",pages,()=>page,k=>page=k),t=group("themes",themes.map(x=>[x,x[0].toUpperCase()+x.slice(1)]),()=>theme,k=>theme=k);
function render(){for(const b of p.children)b.setAttribute("aria-pressed",b.dataset.key===page);for(const b of t.children)b.setAttribute("aria-pressed",b.dataset.key===theme);
const entry=pages.find(x=>x[0]===page);[["before",2,4],["after",3,5]].forEach(([side,image,caption])=>{document.getElementById(side).src=`${entry[image]}-${theme}.webp`;document.getElementById(`${side}-caption`).textContent=entry[caption]})}
render();
</script>
</html>
