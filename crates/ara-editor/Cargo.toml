[package]
name = "ara-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
embed-resource.workspace = true

[dependencies]
ara-crash = { path = "../ara-crash" }
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }
ara-importers = { path = "../ara-importers" }
ara-graph = { path = "../ara-graph" }
ara-material = { path = "../ara-material" }
ara-vfx = { path = "../ara-vfx" }
ara-vfx-gpu = { path = "../ara-vfx-gpu" }
ara-shader-cook = { path = "../ara-shader-cook" }
ara-anim = { path = "../ara-anim" }
ara-profile = { path = "../ara-profile", features = ["gpu"] }
ara-ai = { path = "../ara-ai" }
ara-audio-why = { path = "../ara-audio-why" }
ara-world = { path = "../ara-world", features = ["host"] }
ara-cmd = { path = "../ara-cmd" }
ara-components = { path = "../ara-components" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-gpu = { path = "../ara-gpu" }
ara-export = { path = "../ara-export" }
blake3 = { workspace = true, features = ["std", "pure"] }
dunce = "1.0.5"
ara-editor-gpu = { path = "../ara-editor-gpu" }
ara-host = { path = "../ara-host" }
ara-json = { path = "../ara-json" }
ara-mcp = { path = "../ara-mcp" }
ara-ops = { path = "../ara-ops" }
ara-physics = { path = "../ara-physics" }
ara-platform = { path = "../ara-platform" }
ara-play-host = { path = "../ara-play-host" }
ara-proto = { path = "../ara-proto" }
ara-render = { path = "../ara-render" }
ara-render-fidelity = { path = "../ara-render-fidelity" }
ara-rpc = { path = "../ara-rpc" }
ara-runtime = { path = "../ara-runtime" }
ara-runtime-render = { path = "../ara-runtime-render" }
ara-schema = { path = "../ara-schema" }
ara-ui = { path = "../ara-ui" }
ara-ui-render = { path = "../ara-ui-render" }
ara-ui-text = { path = "../ara-ui-text" }
anyhow = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true, features = ["serde", "bytemuck"] }
glam34 = { workspace = true }
gltf = { workspace = true, default-features = true }
parley = { workspace = true, features = ["std", "complex-scripts"] }
resvg.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
sdl3-sys.workspace = true
accesskit = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.35"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security"] }
