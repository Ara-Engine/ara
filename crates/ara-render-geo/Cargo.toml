[package]
name = "ara-render-geo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
ara-geo = { path = "../ara-geo" }
ara-gpu = { path = "../ara-gpu" }
ara-render = { path = "../ara-render" }
ara-vsm = { path = "../ara-vsm" }
ara-color = { path = "../ara-color" }
ara-schema = { path = "../ara-schema" }
ara-texture-stream = { path = "../ara-texture-stream" }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true, features = ["bytemuck"] }
half = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
ara-platform = { path = "../ara-platform" }
gltf = { workspace = true, features = ["utils", "names"] }
ara-importers = { path = "../ara-importers" }
ara-asset = { path = "../ara-asset" }
ara-asset-format = { path = "../ara-asset-format" }

[lints]
workspace = true
