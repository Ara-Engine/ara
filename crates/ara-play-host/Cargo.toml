[package]
name = "ara-play-host"
description = "The edit-world owner's play and test services: player pool, live link, crash isolation and keep-changes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-importers = { path = "../ara-importers" }
ara-asset = { path = "../ara-asset" }
ara-diag.workspace = true
ara-doc.workspace = true
ara-gpu = { path = "../ara-gpu" }
ara-host.workspace = true
ara-json.workspace = true
ara-ops.workspace = true
ara-play = { path = "../ara-play" }
ara-profile = { path = "../ara-profile" }
ara-proto.workspace = true
ara-runtime = { path = "../ara-runtime" }
ara-schema.workspace = true
ara-script = { path = "../ara-script" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "published"
harness = false
