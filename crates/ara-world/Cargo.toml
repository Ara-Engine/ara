[package]
name = "ara-world"
description = "Partitioned world authoring, cell cooking and budgeted streaming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-asset = { path = "../ara-asset" }
ara-components = { path = "../ara-components" }
ara-diag = { path = "../ara-diag" }
ara-doc = { path = "../ara-doc" }
ara-host = { workspace = true, optional = true }
ara-json = { path = "../ara-json" }
ara-ops = { path = "../ara-ops" }
ara-pack = { path = "../ara-pack" }
ara-proto = { workspace = true, optional = true }
ara-schema = { path = "../ara-schema" }
ara-sim = { path = "../ara-sim" }
blake3 = { workspace = true, default-features = true }
ciborium = { workspace = true }
glam = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror = { workspace = true }

[features]
# The Engine Protocol service (`service::register`) for hosts: CLI daemon, editor.
host = ["dep:ara-host", "dep:ara-proto"]

[dev-dependencies]
ara-merge = { path = "../ara-merge" }
tempfile = { workspace = true }

[[bench]]
name = "flythrough"
harness = false

[lints]
workspace = true
