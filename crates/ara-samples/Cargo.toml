[package]
name = "ara-samples"
description = "Sample projects with real CC0 art: pinned asset fetch, scene authoring through the ara CLI, and the player's Renderlab capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ara-bench = { path = "../ara-bench", default-features = false }
ara-json = { path = "../ara-json" }
anyhow.workspace = true
ara-anim = { path = "../ara-anim" }
ara-asset = { path = "../ara-asset" }
ara-components.workspace = true
ara-diag.workspace = true
ara-doc.workspace = true
ara-ops.workspace = true
ara-proto.workspace = true
ara-rpc.workspace = true
ara-play = { path = "../ara-play" }
ara-play-host = { path = "../ara-play-host" }
ara-runtime = { path = "../ara-runtime" }
ara-schema.workspace = true
ara-terrain = { path = "../ara-terrain" }
blake3 = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive"] }
glam.workspace = true
glam34.workspace = true
image = { workspace = true, features = ["png", "jpeg", "hdr"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
