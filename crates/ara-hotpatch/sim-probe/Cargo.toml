[package]
name = "ara-hotpatch-sim-probe"
description = "Windowless proof of Bevy system patching and deterministic-session guards."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
hotpatch = ["ara-hotpatch/runtime", "ara-sim/hotpatch"]

[dependencies]
anyhow.workspace = true
ara-hotpatch = { path = ".." }
ara-sim = { path = "../../ara-sim" }
ara-components = { path = "../../ara-components" }
ara-doc = { path = "../../ara-doc" }
ara-schema = { path = "../../ara-schema" }
ara-input = { path = "../../ara-input" }
bevy_ecs.workspace = true
serde_json.workspace = true

[[bin]]
name = "ara-hotpatch-sim-probe"
path = "main.rs"
required-features = ["hotpatch"]

[lints]
workspace = true
