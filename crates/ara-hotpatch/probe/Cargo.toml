[package]
name = "ara-hotpatch-probe"
description = "Windowless live Rust render-pass proof for development."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
hotpatch = ["ara-hotpatch/runtime", "ara-render/hotpatch", "ara-render-fidelity/hotpatch"]

[dependencies]
ara-gpu = { path = "../../ara-gpu" }
anyhow.workspace = true
ara-hotpatch = { path = ".." }
ara-render = { path = "../../ara-render" }
ara-render-fidelity = { path = "../../ara-render-fidelity" }
glam.workspace = true
serde_json.workspace = true

[[bin]]
name = "ara-hotpatch-probe"
path = "src/main.rs"
required-features = ["hotpatch"]

[lints]
workspace = true
