[package]
name = "ara-s4-netcode"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[features]
default = ["network"]
network = ["dep:renet", "dep:renet_netcode", "dep:postcard"]

[dependencies]
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
renet = { version = "=2.0.0", optional = true }
renet_netcode = { version = "=2.0.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"], optional = true }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
debug = 1
