[package]
name = "ara-s1-gpu"
version = "0.1.0"
edition = "2024"
default-run = "ara-s1-gpu"

[workspace]

[dependencies]
anyhow = "1.0"
ash = "=0.38.0"
bytemuck = { version = "1.24", features = ["derive"] }
png = "0.18"
sdl3-sys = { version = "=0.7.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# crates.io ash still targets Vulkan 1.3.281; pin the current 1.4 bindings.
# SDL uses its raw C handles; its ash alias assumes the older callback lifetime.
[patch.crates-io]
ash = { git = "https://github.com/ash-rs/ash.git", rev = "f4c2ca3e4f6b998d5254ad101a32f024d87cdec2" }
