[package]
name = "ara-s6-physics"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "s6"

[workspace]
members = ["jolt-sys"]

[features]
# Rapier: rayon-parallel pipeline (needed for multi-threaded Rapier runs).
parallel = ["rapier3d/parallel"]
# Rapier: 8-lane SIMD. Not allowed together with `det`.
simd8 = ["rapier3d/simd8"]
# Cross-platform determinism mode for both engines: Rapier `enhanced-determinism`,
# Jolt JPH_CROSS_PLATFORM_DETERMINISTIC (/fp:precise, no FMA).
det = ["rapier3d/enhanced-determinism", "ara-jolt-sys/cross-platform-deterministic"]

[dependencies]
ara-jolt-sys = { path = "jolt-sys" }
bincode = "=1.3.3"
rapier3d = { version = "=0.36.1", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "s6"
path = "src/main.rs"
