[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own Cargo workspaces.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Engine crates
ara-cmd = { path = "crates/ara-cmd" }
ara-components = { path = "crates/ara-components" }
ara-diag = { path = "crates/ara-diag" }
ara-doc = { path = "crates/ara-doc" }
ara-host = { path = "crates/ara-host" }
ara-json = { path = "crates/ara-json" }
ara-mcp = { path = "crates/ara-mcp" }
ara-merge = { path = "crates/ara-merge" }
ara-ops = { path = "crates/ara-ops" }
ara-proto = { path = "crates/ara-proto" }
ara-rpc = { path = "crates/ara-rpc" }
ara-schema = { path = "crates/ara-schema" }
ara-schema-derive = { path = "crates/ara-schema-derive" }

# Third party
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: writers emit keys in the order they were inserted (reflection order).
# float_roundtrip: parsing is exact, so read -> write is byte-identical.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
syn = { version = "2.0.119", features = ["full"] }
# WebSocket transport for the Engine Protocol (blocking; no async runtime).
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# Tests
insta = "1.49.0"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# Dev builds: light optimization for our crates, full optimization for dependencies,
# so the editor, importers and renderer stay usable in debug (decode, compression, meshopt).
[profile.dev]
opt-level = 1
# No debug info by default: ~1,200 test executables each linking most of the engine
# filled the disk with PDBs even at line-tables-only. Panic messages keep file:line.
# Opt in when debugging: CARGO_PROFILE_DEV_DEBUG=line-tables-only (or `full`).
debug = false

[profile.dev.package."*"]
opt-level = 3
debug = false
