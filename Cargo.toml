[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own Cargo workspaces.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
# Engine crates
ara-cmd = { path = "crates/ara-cmd" }
ara-components = { path = "crates/ara-components" }
ara-diag = { path = "crates/ara-diag" }
ara-doc = { path = "crates/ara-doc" }
ara-json = { path = "crates/ara-json" }
ara-merge = { path = "crates/ara-merge" }
ara-ops = { path = "crates/ara-ops" }
ara-schema = { path = "crates/ara-schema" }
ara-schema-derive = { path = "crates/ara-schema-derive" }

# Third party
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: writers emit keys in the order they were inserted (reflection order).
# float_roundtrip: parsing is exact, so read -> write is byte-identical.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
syn = { version = "2.0.119", features = ["full"] }

# Tests
insta = "1.49.0"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
