[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own Cargo workspaces.
exclude = ["spikes"]

[workspace.package]
version = "0.0.2-alpha.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Engine crates
ara-cmd = { path = "crates/ara-cmd" }
ara-components = { path = "crates/ara-components" }
ara-diag = { path = "crates/ara-diag" }
ara-doc = { path = "crates/ara-doc" }
ara-host = { path = "crates/ara-host" }
ara-json = { path = "crates/ara-json" }
ara-mcp = { path = "crates/ara-mcp" }
ara-merge = { path = "crates/ara-merge" }
ara-ops = { path = "crates/ara-ops" }
ara-proto = { path = "crates/ara-proto" }
ara-rpc = { path = "crates/ara-rpc" }
ara-schema = { path = "crates/ara-schema" }
ara-schema-derive = { path = "crates/ara-schema-derive" }

# Third party
# Features stay on members so focused gates keep their original feature sets.
accesskit = "0.25.1"
anyhow = "1.0.103"
ash = { git = "https://github.com/ash-rs/ash.git", rev = "f4c2ca3e4f6b998d5254ad101a32f024d87cdec2" }
bevy_ecs = { version = "0.20.0", default-features = false }
bevy_tasks = "0.20.0"
blake3 = { version = "1.8.7", default-features = false }
bytemuck = "1.24"
cc = "1.2"
ciborium = "0.2.2"
clap = "4.6.7"
embed-resource = "3"
glam = "0.30.9"
# The presentation adapter consumes both existing API versions; no version upgrades.
glam30 = { version = "0.30.9", package = "glam" }
glam33 = { version = "0.33", package = "glam" }
glam34 = { version = "0.34.1", package = "glam" }
gltf = { version = "1.4.1", default-features = false }
half = "2.7.1"
image = { version = "0.25.10", default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2"
libloading = "0.9"
libloading08 = { version = "0.8.9", package = "libloading" }
parley = { version = "0.12.0", default-features = false }
postcard = { version = "1.1.3", default-features = false }
proc-macro2 = "1.0.107"
quote = "1.0.47"
rayon = "1.11.0"
resvg = { version = "0.45", default-features = false }
roxmltree = "0.21.1"
rtrb = "0.4"
ryu = "1.0.23"
serde = "1.0.229"
# Canonical writers enable preserve_order and float_roundtrip on their members.
serde_json = "1.0.154"
sdl3-sys = { version = "0.7.2", default-features = false }
sha2 = "0.10"
syn = { version = "2.0.119", features = ["full"] }
tempfile = "3.27.0"
texture2ddecoder = "0.1.2"
thiserror = "2.0.18"
tracing = "0.1"
tungstenite = { version = "0.30.0", default-features = false }
tungstenite28 = { version = "0.28.0", default-features = false, package = "tungstenite" }
windows-sys = "0.61"
windows = "0.62.2"
zip = { version = "2.4.2", default-features = false }

# Tests
insta = "1.49.0"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# Dev builds: light optimization for our crates, full optimization for dependencies,
# so the editor, importers and renderer stay usable in debug (decode, compression, meshopt).
[profile.dev]
opt-level = 1
# No debug info by default: ~1,200 test executables each linking most of the engine
# filled the disk with PDBs even at line-tables-only. Panic messages keep file:line.
# Opt in when debugging: CARGO_PROFILE_DEV_DEBUG=line-tables-only (or `full`).
debug = false

[profile.dev.package."*"]
opt-level = 3
debug = false

# Fast optimized iteration; release remains the shipping/performance-bar build.
[profile.perf]
inherits = "release"
incremental = true
codegen-units = 256
lto = false
debug = "line-tables-only"

[profile.perf.package."*"]
opt-level = 3

# Deterministic transport clock patches: crates/ara-net/vendor/PATCHES.md.
[patch.crates-io]
lightyear_sync = { path = "crates/ara-net/vendor/lightyear_sync" }
lightyear_transport = { path = "crates/ara-net/vendor/lightyear_transport" }
